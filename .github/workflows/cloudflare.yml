name: cloudflare

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CLOUDFLARE_API_TOKEN is given only to the steps that call Cloudflare, not to the build, which
    # runs third-party packages with every permission (deno run -A).
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Whether the Worker has VAPID_KEYS yet. cloudflare.config.ts declares the secret only
      # when it does: the first deploy has no previous version to inherit it from.
      - name: Check the VAPID key
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Two lines so that a failed check fails the step instead of passing an empty value on.
        run: |
          has=$(deno task -q set-vapid-keys --check)
          echo "KAGI_HAS_VAPID_KEYS=$has" >> "$GITHUB_ENV"
      # Static site + Worker bundle,
      # arranged as the Build Output Specification for `cf deploy --prebuilt`.
      - run: deno task build:cf
      - run: deno task cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Worker has no key yet (first deploy): it exists now, so give it one.
      - name: Set the VAPID key
        if: env.KAGI_HAS_VAPID_KEYS == '0'
        timeout-minutes: 3
        run: deno task set-vapid-keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
